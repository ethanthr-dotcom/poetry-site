<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诗泉</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f4f1e8;
      color: #2f2a24;
    }
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      text-align: center;
      font-size: 34px;
      margin: 0 0 8px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .subtitle {
      text-align: center;
      color: #746b61;
      margin-bottom: 28px;
    }
    .controls, .card {
      background: rgba(255,255,255,.82);
      border: 1px solid #ddd4c7;
      border-radius: 16px;
      box-shadow: 0 8px 26px rgba(70,55,35,.08);
    }
    .controls {
      padding: 18px;
      margin-bottom: 22px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #665d54;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfc4b6;
      border-radius: 9px;
      font-size: 15px;
      background: #fff;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      background: #4f5f4a;
      color: white;
    }
    button:hover { opacity: .92; }
    button:disabled { opacity: .55; cursor: wait; }
    .tip {
      font-size: 13px;
      color: #756c62;
      margin-top: 10px;
      line-height: 1.6;
    }
    /* 后台预加载进度指示器 */
    .preload-wrap {
      margin-top: 10px;
      transition: opacity 0.6s ease;
    }
    .preload-bar {
      height: 4px;
      background: #e0d9cc;
      border-radius: 2px;
      overflow: hidden;
    }
    .preload-bar-fill {
      height: 100%;
      background: #4f5f4a;
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .preload-text {
      font-size: 12px;
      color: #8a8076;
      margin-top: 4px;
    }
    .preload-text.done {
      color: #4f5f4a;
    }
    .card {
      padding: 42px 28px;
      min-height: 360px;
      text-align: center;
    }
    .title {
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .meta {
      color: #766d63;
      margin-bottom: 28px;
      font-size: 16px;
    }
    .content {
      max-width: 650px;
      margin: 0 auto;
      font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
      font-size: 23px;
      line-height: 2;
      white-space: pre-wrap;
    }
    .category {
      margin-top: 30px;
      font-size: 13px;
      color: #958a7e;
    }
    .status {
      padding-top: 100px;
      color: #766d63;
      line-height: 1.8;
    }
    .error {
      color: #a3382f;
      font-size: 16px;
    }
    @media (max-width: 650px) {
      .row { grid-template-columns: 1fr; }
      .page { padding: 24px 12px; }
      .card { padding: 30px 18px; }
      .content { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>诗泉</h1>
    <div class="subtitle">本地古诗词浏览器</div>

    <section class="controls">
      <div class="row">
        <div>
          <label for="author">作者（可留空）</label>
          <input id="author" placeholder="例如：李白">
        </div>
        <div>
          <label for="dynasty">朝代（可留空）</label>
          <input id="dynasty" placeholder="例如：唐">
        </div>
        <div>
          <label for="type">体裁（可留空）</label>
          <input id="type" placeholder="例如：五言绝句">
        </div>
      </div>
      <button id="randomButton" type="button">随机显示一首诗</button>
      <div class="tip">
        共收录 37 万余首古诗词，首次打开后自动后台加载，加载完成后随机抽取秒出。
      </div>
      <div class="preload-wrap" id="preloadWrap">
        <div class="preload-bar"><div class="preload-bar-fill" id="preloadFill"></div></div>
        <div class="preload-text" id="preloadText">等待后台加载…</div>
      </div>
    </section>

    <section class="card" id="card">
      <div class="status">正在加载诗词库……</div>
    </section>
  </main>

  <script>
    // 全局索引：{ total, chunks: [{ file, count, dynasty, authors[], types[] }] }
    let INDEX = null;
    let TOTAL = 0;
    // 已加载分块的内存缓存：file -> 诗词数组
    const chunkCache = new Map();

    const $ = (id) => document.getElementById(id);
    const button = $("randomButton");
    const card = $("card");
    const authorInput = $("author");
    const dynastyInput = $("dynasty");
    const typeInput = $("type");

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showStatus(message, isError) {
      card.innerHTML =
        '<div class="status' + (isError ? " error" : "") + '">' +
        escapeHtml(message) +
        "</div>";
    }

    function renderPoem(poem) {
      const title = poem.t ?? "";
      const author = poem.a ?? "";
      const dynasty = poem.d ?? "";
      const type = poem.y ?? "";
      const content = poem.c ?? "";
      const meta = [dynasty, author].filter(Boolean).join(" · ");
      card.innerHTML =
        '<div class="title">' + escapeHtml(title || "无题") + "</div>" +
        '<div class="meta">' + escapeHtml(meta) + "</div>" +
        '<div class="content">' + escapeHtml(content || "未找到正文") + "</div>" +
        (type ? '<div class="category">体裁：' + escapeHtml(type) + "</div>" : "");
    }

    // 按 count 加权随机选择一个元素
    function weightedRandom(items) {
      const total = items.reduce((s, c) => s + c.count, 0);
      let r = Math.random() * total;
      for (const item of items) {
        r -= item.count;
        if (r < 0) return item;
      }
      return items[items.length - 1];
    }

    // 加载分块数据（带内存缓存）
    async function loadChunk(file) {
      if (chunkCache.has(file)) return chunkCache.get(file);
      const res = await fetch("data/" + file);
      if (!res.ok) throw new Error("分块数据加载失败：" + file);
      const poems = await res.json();
      chunkCache.set(file, poems);
      return poems;
    }

    // 根据筛选条件过滤 chunks（用 chunk 级元数据做粗筛）
    function filterChunks(author, dynasty, type) {
      let chunks = INDEX.chunks;
      if (dynasty) {
        chunks = chunks.filter((c) => c.dynasty === dynasty);
      }
      if (author) {
        chunks = chunks.filter(
          (c) => Array.isArray(c.authors) && c.authors.some((a) => a.trim() === author)
        );
      }
      if (type) {
        chunks = chunks.filter(
          (c) => Array.isArray(c.types) && c.types.some((t) => t.trim() === type)
        );
      }
      return chunks;
    }

    // 在单首诗层面匹配全部条件（精确匹配，去空格）
    function matchPoem(poem, author, dynasty, type) {
      if (author && (poem.a ?? "").trim() !== author) return false;
      if (dynasty && (poem.d ?? "").trim() !== dynasty) return false;
      if (type && (poem.y ?? "").trim() !== type) return false;
      return true;
    }

    // Fisher–Yates 洗牌
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function loadRandomPoem() {
      button.disabled = true;
      button.textContent = "正在读取……";

      const author = authorInput.value.trim();
      const dynasty = dynastyInput.value.trim();
      const type = typeInput.value.trim();

      try {
        if (!INDEX) {
          showStatus("诗词库尚未加载完成，请稍候……");
          return;
        }

        const candidates = filterChunks(author, dynasty, type);
        if (!candidates.length) {
          showStatus("未找到匹配条件的诗", true);
          return;
        }

        // 首选按 count 加权随机；若无匹配诗，依次尝试其它候选分块（安全网）
        const first = weightedRandom(candidates);
        const rest = shuffle(candidates.filter((c) => c.file !== first.file));
        const order = [first].concat(rest);
        const maxTries = Math.min(order.length, 8);

        for (let i = 0; i < maxTries; i++) {
          const chunk = order[i];
          const poems = await loadChunk(chunk.file);
          const matched = poems.filter((p) => matchPoem(p, author, dynasty, type));
          if (matched.length) {
            const poem = matched[Math.floor(Math.random() * matched.length)];
            renderPoem(poem);
            return;
          }
        }
        showStatus("未找到匹配条件的诗", true);
      } catch (err) {
        showStatus("读取失败：" + (err && err.message ? err.message : err), true);
      } finally {
        button.disabled = false;
        button.textContent = "随机显示一首诗";
      }
    }

    async function loadIndex() {
      showStatus("正在加载诗词库……");
      try {
        const res = await fetch("data/index.json");
        if (!res.ok) throw new Error("索引加载失败 (HTTP " + res.status + ")");
        INDEX = await res.json();
        TOTAL = (INDEX && INDEX.total) || 0;
        showStatus(
          "共收录 " + TOTAL.toLocaleString("zh-CN") + " 首诗，点击下方按钮随机抽取"
        );
      } catch (err) {
        showStatus(
          "诗词库加载失败：" + (err && err.message ? err.message : err),
          true
        );
      }
    }

    // ====== 后台渐进式预加载 ======
    // 预加载是否已启动（避免重复启动）
    let preloadStarted = false;

    // 统计当前已缓存的分块数
    function countCachedChunks() {
      if (!INDEX) return 0;
      let n = 0;
      for (const c of INDEX.chunks) if (chunkCache.has(c.file)) n++;
      return n;
    }

    // 更新预加载进度（加载中）
    function updateProgress() {
      const total = INDEX ? INDEX.chunks.length : 0;
      const cached = countCachedChunks();
      const fill = $("preloadFill");
      const text = $("preloadText");
      if (fill && text && total) {
        fill.style.width = Math.round((cached / total) * 100) + "%";
        text.textContent = "后台预加载中... " + cached + " / " + total;
        text.classList.remove("done");
      }
    }

    // 预加载完成
    function updateProgressDone() {
      const fill = $("preloadFill");
      const text = $("preloadText");
      if (fill) fill.style.width = "100%";
      if (text) {
        text.textContent = "全部诗词已就绪，随机抽取秒出 ✓";
        text.classList.add("done");
      }
      // 几秒后淡出，不干扰主界面
      setTimeout(() => {
        const wrap = $("preloadWrap");
        if (wrap) wrap.style.opacity = "0";
      }, 4000);
    }

    // 启动后台预加载：3 个并发，逐个缓存
    function startPreloading() {
      if (preloadStarted || !INDEX) return;
      preloadStarted = true;

      // 还未缓存的分块
      const pending = INDEX.chunks.filter((c) => !chunkCache.has(c.file));
      if (!pending.length) {
        updateProgressDone();
        return;
      }

      const total = pending.length;
      let active = 0;   // 当前在途请求数
      let idx = 0;     // 下一个待派发的分块下标

      function fetchNext() {
        // 全部派发完毕
        if (idx >= total) {
          if (active === 0) updateProgressDone();
          return;
        }
        // 并发已满，等待回调
        if (active >= 3) return;

        const chunk = pending[idx++];
        active++;
        updateProgress();

        // 复用 loadChunk（带缓存），出错不影响整体
        loadChunk(chunk.file)
          .then(() => {
            updateProgress();
          })
          .catch(() => {
            // 单个分块失败不中断后续
          })
          .finally(() => {
            active--;
            fetchNext();
          });

        // 尽量填满并发槽位
        fetchNext();
      }

      fetchNext();
    }

    button.addEventListener("click", loadRandomPoem);

    // 页面加载：先加载索引，再自动随机显示一首诗，随后后台预加载
    (async () => {
      await loadIndex();
      if (INDEX) {
        await loadRandomPoem();   // 显示首诗（同时缓存首诗所在分块）
        startPreloading();        // 首诗显示后，启动后台预加载剩余分块
      }
    })();
  </script>
</body>
</html>
