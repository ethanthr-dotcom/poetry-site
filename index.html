<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诗泉</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="shortcut icon" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    * { box-sizing: border-box; }
    /* 度量兜底字体：消除网络字体加载替换时的布局跳动（size-adjust 对齐占位字体度量） */
    @font-face { font-family: "SerifFallback"; src: local("Songti SC"), local("STSong"), local("SimSun"), local("宋体"); size-adjust: 100%; ascent-override: 92%; descent-override: 20%; font-display: swap; }
    @font-face { font-family: "SansFallback"; src: local("PingFang SC"), local("Microsoft YaHei"), local("Heiti SC"), local("SimHei"); size-adjust: 100%; ascent-override: 92%; descent-override: 20%; font-display: swap; }
    :root {
      /* 配色（默认：暖纸） */
      --bg-color: #f4f1e8;
      --text-color: #2f2a24;
      --card-bg: rgba(255,255,255,.82);
      --card-border: #ddd4c7;
      --card-shadow: 0 8px 26px rgba(70,55,35,.08);
      --accent-color: #4f5f4a;
      --meta-color: #766d63;
      --tip-color: #756c62;
      --label-color: #665d54;
      --input-bg: #fff;
      --input-border: #cfc4b6;
      --subtitle-color: #746b61;
      --category-color: #958a7e;
      --error-color: #a3382f;
      --button-text: #fff;
      --seal-color: #a3382f;
      /* 字体（默认：思源宋体，按需从 jsDelivr 加载） */
      --font-body: "Noto Serif SC", "SerifFallback", "Songti SC", "STSong", "SimSun", "宋体", serif;
      --font-content: "Noto Serif SC", "SerifFallback", "Songti SC", "STSong", "SimSun", serif;
      /* 排版（默认：居中） */
      --max-width: 900px;
      --page-padding: 48px 20px;
      --card-padding: 42px 28px;
      --content-font-size: 35px;
      --title-font-size: 36px;
      --meta-font-size: 23px;
      --category-font-size: 20px;
      --h1-font-size: 34px;
    }
    ::selection { background: var(--accent-color); color: var(--button-text); }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    /* 页面点缀：主题色的柔和光晕 */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(circle, var(--accent-color), transparent 70%);
      opacity: .06;
    }
    body::before { top: -140px; right: -140px; width: 380px; height: 380px; }
    body::after { bottom: -160px; left: -160px; width: 420px; height: 420px; opacity: .05; }
    /* 页面点缀：飞鸟、竹子、山峦（跟随主题色） */
    .deco { position: fixed; z-index: 0; pointer-events: none; color: var(--accent-color); opacity: .1; }
    .deco-birds { top: 84px; left: 5vw; width: 130px; animation: birdFloat 7s ease-in-out infinite alternate; }
    .deco-bamboo { left: max(6px, calc(50% - 620px)); bottom: 0; height: 46vh; opacity: .08; }
    .deco-mountains { right: 0; bottom: 0; width: min(48vw, 540px); opacity: .07; }
    @keyframes birdFloat {
      from { transform: translate(0, 0); }
      to { transform: translate(22px, -12px); }
    }
    @media (max-width: 900px) { .deco-bamboo, .deco-birds { display: none; } }
    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--page-padding);
      position: relative;
      z-index: 1;
    }
    h1 {
      text-align: center;
      margin: 0 0 8px;
      line-height: 0;
    }
    /* SVG logo：顶部阳刻 / 页脚阴刻 */
    .site-logo { display: block; margin: 0 auto; height: 52px; width: auto; }
    .splash-logo { height: 64px; width: auto; opacity: 0; animation: splashIn 1.1s cubic-bezier(.22,.61,.36,1) .1s forwards; }
    .footer-logo { display: block; margin: 0 auto; height: 44px; width: auto; }
    .subtitle {
      text-align: center;
      color: var(--subtitle-color);
      margin-bottom: 28px;
    }
    .controls, .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      transition: background 0.3s, border-color 0.3s;
    }
    .controls { padding: 18px; margin-bottom: 22px; }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--label-color);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--input-border);
      border-radius: 9px;
      font-size: 15px;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: inherit;
      transition: background 0.3s, border-color 0.3s;
    }
    input::placeholder { color: var(--label-color); opacity: .6; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      background: var(--accent-color);
      color: var(--button-text);
      font-family: inherit;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary {
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      margin-top: 10px;
    }
    .secondary:hover { background: var(--accent-color); color: var(--button-text); }
    /* ====== 卡片比例选择（居中） ====== */
    .ratio-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
    .ratio-label { font-size: 13px; color: var(--label-color); }
    .ratio-opt {
      width: auto; padding: 5px 12px; font-size: 13px; border-radius: 8px;
      border: 1px solid var(--input-border); background: var(--input-bg);
      color: var(--text-color); cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .ratio-opt.active { background: var(--accent-color); color: var(--button-text); border-color: var(--accent-color); }
    /* 字体加载完成前隐藏卡片内容，加载完同时淡入，避免跳动 */
    .title, .meta, .content, .category { transition: opacity .4s ease; }
    .title.pending, .meta.pending, .content.pending, .category.pending { opacity: 0; }
    /* ====== 顶部加载进度条 ====== */
    #progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--accent-color); z-index: 1001; opacity: 0;
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent-color) 55%, transparent);
      transition: width .35s ease, opacity .3s ease;
    }
    #progress.run { opacity: 1; width: 88%; transition: width 1.3s cubic-bezier(.22,.61,.36,1), opacity .2s; }
    #progress.done { width: 100%; opacity: 0; transition: width .25s ease, opacity .45s ease .15s; }
    /* ====== 按钮悬浮动画（纯色：提亮 + 微放大 + 阴影） ====== */
    #randomButton, .theme-opt, .theme-toggle {
      transition: transform .25s cubic-bezier(.22,.61,.36,1), background .25s,
        box-shadow .25s, filter .25s, border-color .25s;
    }
    #randomButton:hover {
      filter: brightness(1.12);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 22px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }
    .theme-opt:hover, .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--accent-color);
    }
    .tip {
      font-size: 13px;
      color: var(--tip-color);
      margin-top: 10px;
      line-height: 1.6;
      text-align: center;
    }
    .card {
      padding: var(--card-padding);
      min-height: 360px;
      text-align: center;
      position: relative;
      overflow: hidden;
      scroll-margin-top: 20px;
    }
    /* 点缀：卡片内淡雅水印 */
    .card::before {
      content: "詩";
      position: absolute;
      right: 4%;
      bottom: -30px;
      font-family: var(--font-content);
      font-size: 190px;
      line-height: 1;
      color: var(--text-color);
      opacity: .045;
      pointer-events: none;
    }
    /* 点缀：卡片内框装饰 */
    .card::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      pointer-events: none;
      opacity: .22;
    }
    .title {
      font-size: var(--title-font-size);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .meta {
      color: var(--meta-color);
      margin-bottom: 28px;
      font-size: var(--meta-font-size);
    }
    .content {
      margin: 0 auto;
      font-family: var(--font-content);
      font-size: var(--content-font-size);
      line-height: 2;
      text-align: center;
    }
    /* 每行保持完整分句；.wrap 允许八字以上分句自适应换行 */
    .verse-line { margin: 0; white-space: nowrap; }
    .verse-line.wrap { white-space: normal; }
    .title, .meta { white-space: nowrap; }
    /* 竖排显示（设置里可选）：高度随最长句自适应，绝不截断 */
    body.vertical .content {
      writing-mode: vertical-rl;
      max-width: none;
      width: fit-content;
      height: auto;
      margin: 0 auto;
      line-height: 2;
      white-space: normal;
    }
    body.vertical .verse-line { display: block; margin: 0; white-space: nowrap; }
    .category {
      margin-top: 30px;
      font-size: var(--category-font-size);
      color: var(--category-color);
    }
    /* 页脚：阴刻 logo → 宣传语 → 版权，全部居中 */
    .site-footer { margin: 42px auto 12px; text-align: center; }
    .slogan {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--category-color);
      text-align: center;
    }
    .copyright {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--category-color);
      opacity: .85;
      user-select: none;
    }
    .status {
      padding-top: 100px;
      color: var(--meta-color);
      line-height: 1.8;
    }
    .error { color: var(--error-color); font-size: 16px; }
    /* ====== 开屏动画 ====== */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      cursor: pointer;
      transition: opacity .8s ease, visibility 0s linear .8s;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    .splash-box { text-align: center; }
    .splash-rule {
      width: 0;
      height: 1px;
      margin: 22px auto;
      background: var(--text-color);
      opacity: 0;
      animation: ruleGrow 1s ease .6s forwards;
    }
    .splash-motto {
      font-size: 17px;
      letter-spacing: 4px;
      color: var(--meta-color);
      opacity: 0;
      animation: fadeUp .8s ease 1.1s forwards;
    }
    .splash-note {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--category-color);
      opacity: 0;
      animation: fadeUp .8s ease 1.5s forwards;
    }
    @keyframes splashIn {
      from { opacity: 0; letter-spacing: 26px; text-indent: 26px; }
      to { opacity: 1; letter-spacing: 10px; text-indent: 10px; }
    }
    @keyframes ruleGrow { to { width: 120px; opacity: .4; } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    /* ====== 主题切换面板 ====== */
    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 26px;
      height: 26px;
      background: transparent;
      border: 0;
      color: var(--text-color);
      cursor: pointer;
      z-index: 1200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 0;
      opacity: .7;
    }
    .theme-toggle svg { width: 26px; height: 26px; display: block; }
    .theme-toggle:hover { transform: rotate(30deg); opacity: 1; }
    .theme-toggle:active { transform: rotate(60deg) scale(.92); }
    .theme-panel {
      position: absolute;
      top: 66px;
      right: 16px;
      width: 240px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      padding: 16px;
      z-index: 1199;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.96);
      transform-origin: top right;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity .22s ease, transform .22s cubic-bezier(.22,.61,.36,1), visibility 0s linear .22s, background 0.3s, border-color 0.3s;
    }
    .theme-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition: opacity .22s ease .02s, transform .22s cubic-bezier(.22,.61,.36,1) .02s, visibility 0s, background 0.3s, border-color 0.3s;
    }
    .theme-section { margin-bottom: 14px; }
    .theme-section:last-child { margin-bottom: 0; }
    .theme-label {
      font-size: 12px;
      color: var(--label-color);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .theme-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .theme-opt {
      width: auto;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .theme-opt.active {
      background: var(--accent-color);
      color: var(--button-text);
      border-color: var(--accent-color);
    }
    @media (max-width: 650px) {
      .row { grid-template-columns: 1fr; }
      .theme-panel { right: 8px; left: 8px; width: auto; }
      .splash-logo { height: 46px; }
      .deco-mountains { width: 70vw; }
    }
  </style>
</head>

  <!-- 开屏动画：说明非营利初衷（每次会话显示一次，点击可跳过） -->

    <div class="splash-box">
      <img class="splash-logo" src="logo-yang.svg" alt="诗泉">

  <main class="page">
    <h1><img class="site-logo" src="logo-yang.svg" alt="诗泉"></h1>
    <div class="subtitle">在线古诗词浏览器</div>

    <section class="controls">
      <div class="row">
        <div>
          <label for="author">作者（可留空）</label>
          <input id="author" placeholder="例如：李白">
        </div>
        <div>
          <label for="dynasty">朝代（可留空）</label>
          <input id="dynasty" placeholder="例如：唐">
        </div>
        <div>
          <label for="type">体裁（可留空）</label>
          <input id="type" placeholder="例如：五言绝句">
        </div>
      </div>
      <button id="randomButton" type="button">随机显示一首诗</button>
      <div class="ratio-row">
        <span class="ratio-label">卡片比例</span>
        <button class="ratio-opt active" data-ratio="1:1" type="button">1:1</button>
        <button class="ratio-opt" data-ratio="3:4" type="button">3:4</button>
        <button class="ratio-opt" data-ratio="9:16" type="button">9:16</button>
      </div>
      <button id="shareButton" type="button" class="secondary">分享诗词卡片</button>
      <div class="tip">
        共收录 37 万余首古诗词 · 非营利项目 · 按需加载即时抽取
      </div>
    </section>

    <section class="card" id="card">
      <div class="status">正在加载诗词库……</div>
    </section>

    <footer class="site-footer">
      <img class="footer-logo" src="logo-yin.svg" alt="诗泉">
      <div class="slogan">诗泉 · 非营利古诗词共享项目</div>
      <div class="copyright">版权所有 © Ethan 2026</div>
    </footer>
  </main>

  <button id="themeToggle" class="theme-toggle" title="主题设置" aria-label="主题设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <div id="themePanel" class="theme-panel">
    <div class="theme-section">
      <div class="theme-label">配色</div>
      <div class="theme-options" data-group="color">
        <button class="theme-opt active" data-value="warm">暖纸</button>
        <button class="theme-opt" data-value="ink">水墨</button>
        <button class="theme-opt" data-value="dark">暗夜</button>
        <button class="theme-opt" data-value="celadon">青瓷</button>
        <button class="theme-opt" data-value="morandi">莫兰迪</button>
        <button class="theme-opt" data-value="vivid">炽烈</button>
        <button class="theme-opt" data-value="vangogh">星夜</button>
        <button class="theme-opt" data-value="rembrandt">伦勃朗</button>
        <button class="theme-opt" data-value="rouge">胭脂</button>
        <button class="theme-opt" data-value="daiqing">黛青</button>
        <button class="theme-opt" data-value="moss">苔绿</button>
        <button class="theme-opt" data-value="amber">琥珀</button>
        <button class="theme-opt" data-value="indigo">靛蓝</button>
        <button class="theme-opt" data-value="lotus">藕荷</button>

        <button class="theme-opt" data-value="qinghua">青花</button>
      </div>
    </div>
    <div class="theme-section">
      <div class="theme-label">排版</div>
      <div class="theme-options" data-group="layout">
        <button class="theme-opt active" data-value="centered">居中</button>
        <button class="theme-opt" data-value="wide">宽屏</button>
        <button class="theme-opt" data-value="compact">紧凑</button>
      </div>
    </div>
    <div class="theme-section">
      <div class="theme-label">字号</div>
      <div class="theme-options" data-group="size">
        <button class="theme-opt" data-value="small">小</button>
        <button class="theme-opt active" data-value="medium">中</button>
        <button class="theme-opt" data-value="large">大</button>
      </div>
    </div>
    <div class="theme-section">
      <div class="theme-label">文字方向</div>
      <div class="theme-options" data-group="direction">
        <button class="theme-opt active" data-value="horizontal">横排</button>
        <button class="theme-opt" data-value="vertical">竖排</button>
      </div>
    </div>
  </div>

  <script>
    // ====== 数据源配置 ======
    // 本地开发走相对路径（本地服务器秒加载），线上走 jsDelivr CDN（国内可访问）
    const IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    const DATA_BASE = IS_LOCAL ? "" : "https://cdn.jsdelivr.net/gh/ethanthr-dotcom/poetry-site@main/";

    const INDEX_CACHE_KEY = "poetry-index-v3";
    const FULL_CACHE_KEY = "poetry-index-full-v1";
    const CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 7 天

    // 精简索引：{ total, chunks: [{ file, count, dynasties[] }] }
    let INDEX = null;
    // 筛选索引（额外含 authors/types），仅用户使用作者/体裁筛选时按需加载
    let FULL_INDEX = null;
    let TOTAL = 0;
    const chunkCache = new Map();

    const $ = (id) => document.getElementById(id);
    const button = $("randomButton");
    const card = $("card");
    const authorInput = $("author");
    const dynastyInput = $("dynasty");
    const typeInput = $("type");
    const progressEl = $("progress");
    function progressStart() {
      if (!progressEl) return;
      progressEl.classList.remove("done", "run");
      progressEl.style.width = "";
      void progressEl.offsetWidth;
      progressEl.classList.add("run");
    }
    function progressDone() {
      if (!progressEl) return;
      progressEl.classList.remove("run");
      progressEl.classList.add("done");
      setTimeout(() => {
        progressEl.classList.remove("done");
        progressEl.style.width = "0";
      }, 500);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showStatus(message, isError) {
      card.innerHTML =
        '<div class="status' + (isError ? " error" : "") + '">' +
        escapeHtml(message) +
        "</div>";
    }

    // 按完整句拆分正文（。！？；各占一行，避免单字独占一行或重叠）
    function splitVerses(text) {
      const clean = (text || "").replace(/\s+/g, "");
      if (!clean) return [];
      const lines = [];
      let buf = "";
      for (const ch of clean) {
        buf += ch;
        if ("。！？；".includes(ch)) { lines.push(buf); buf = ""; }
      }
      if (buf) lines.push(buf);
      return lines;
    }

    let currentPoem = null;

    // 按逗号/顿号拆分长句为完整分句（每行都以标点结尾，绝不在分句中间断开）
    function splitClauseLines(text) {
      const parts = [];
      let buf = "";
      for (const ch of text) {
        buf += ch;
        if ("，、".includes(ch)) { parts.push(buf); buf = ""; }
      }
      if (buf) parts.push(buf);
      return parts.length > 1 ? parts : [text];
    }

    // 判断是否为五言/七言绝句（体裁命中，或各分句均为五/七字且不超过四句）
    function isShortJueju(poem) {
      const t = poem.y || "";
      if (/五言绝句|七言绝句/.test(t)) return true;
      const clauses = [];
      for (const v of splitVerses(poem.c)) {
        for (const c of splitClauseLines(v)) clauses.push(c);
      }
      if (clauses.length < 2 || clauses.length > 4) return false;
      return clauses.every((c) => {
        const n = c.replace(/[，、。！？；]/g, "").length;
        return n === 5 || n === 7;
      });
    }

    // 排版规则（不缩小字号）：
    // 1. 五/七言绝句：一行两个小句（句号换行），宽度不够时改为逗号换行
    // 2. 非五/七言：八字以上的小句允许自适应换行，八字以下保持整行
    function fitCardText() {
      const contentEl = card.querySelector(".content");
      if (!contentEl || !currentPoem) return;
      const verses = splitVerses(currentPoem.c);
      const isV = document.body.classList.contains("vertical");
      // 竖排：恢复整句成列
      if (isV) {
        contentEl.innerHTML = verses
          .map((v) => '<div class="verse-line">' + escapeHtml(v) + "</div>")
          .join("");
        return;
      }
      const cs = getComputedStyle(card);
      const innerW =
        card.clientWidth -
        parseFloat(cs.paddingLeft) -
        parseFloat(cs.paddingRight) -
        28;

      const clauses = [];
      for (const v of verses) {
        for (const c of splitClauseLines(v)) clauses.push(c);
      }

      const html = [];
      if (isShortJueju(currentPoem)) {
        // 探针元素继承正文字体，实测两小句同行是否放得下
        const probe = document.createElement("span");
        probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;";
        contentEl.appendChild(probe);
        for (let i = 0; i < clauses.length; i += 2) {
          const a = clauses[i];
          const b = clauses[i + 1];
          if (b) {
            probe.textContent = a + b;
            if (probe.scrollWidth <= innerW + 2) {
              html.push('<div class="verse-line">' + escapeHtml(a + b) + "</div>");
              continue;
            }
          }
          html.push('<div class="verse-line">' + escapeHtml(a) + "</div>");
          if (b) html.push('<div class="verse-line">' + escapeHtml(b) + "</div>");
        }
        probe.remove();
      } else {
        for (const c of clauses) {
          const n = c.replace(/[，、。！？；]/g, "").length;
          const cls = n >= 8 ? "verse-line wrap" : "verse-line";
          html.push('<div class="' + cls + '">' + escapeHtml(c) + "</div>");
        }
      }
      contentEl.innerHTML = html.join("");
    }

    let fitTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitCardText, 120);
    });

    function renderPoem(poem) {
      currentPoem = poem;
      const title = poem.t ?? "";
      const author = poem.a ?? "";
      const dynasty = poem.d ?? "";
      const type = poem.y ?? "";
      const content = poem.c ?? "";
      const meta = [dynasty, author].filter(Boolean).join(" · ");
      const verses = splitVerses(content);
      const contentHtml = verses.length
        ? verses.map((x) => '<div class="verse-line">' + escapeHtml(x) + "</div>").join("")
        : "未找到正文";
      card.innerHTML =
        '<div class="title">' + escapeHtml(title || "无题") + "</div>" +
        '<div class="meta">' + escapeHtml(meta) + "</div>" +
        '<div class="content">' + contentHtml + "</div>" +
        (type ? '<div class="category">体裁：' + escapeHtml(type) + "</div>" : "");

      // 字体加载完成前隐藏全部卡片内容，加载完同时淡入，避免跳动
      const pendingEls = card.querySelectorAll(".title, .meta, .content, .category");
      pendingEls.forEach((el) => el.classList.add("pending"));
      const loadText = (poem.t || "") + (poem.c || "");
      const fontReady =
        document.fonts && document.fonts.load
          ? document.fonts.load('1em "Noto Serif SC"', loadText)
          : Promise.resolve();
      Promise.resolve(fontReady)
        .catch(() => {})
        .finally(() => {
          requestAnimationFrame(() => {
            fitCardText();
            pendingEls.forEach((el) => el.classList.remove("pending"));
          });
        });
    }

    function weightedRandom(items) {
      const total = items.reduce((s, c) => s + c.count, 0);
      let r = Math.random() * total;
      for (const item of items) {
        r -= item.count;
        if (r < 0) return item;
      }
      return items[items.length - 1];
    }

    async function loadChunk(file) {
      if (chunkCache.has(file)) return chunkCache.get(file);
      const res = await fetch(DATA_BASE + "data/" + file);
      if (!res.ok) throw new Error("分块数据加载失败：" + file);
      const poems = await res.json();
      chunkCache.set(file, poems);
      return poems;
    }

    // 兼容新旧索引格式（dynasties 数组 / dynasty 字符串）
    function chunkHasDynasty(c, dynasty) {
      if (Array.isArray(c.dynasties)) return c.dynasties.includes(dynasty);
      return c.dynasty === dynasty;
    }

    function filterChunks(author, dynasty, type) {
      const source = (author || type) && FULL_INDEX ? FULL_INDEX : INDEX;
      let chunks = source.chunks;
      if (dynasty) {
        chunks = chunks.filter((c) => chunkHasDynasty(c, dynasty));
      }
      if (author) {
        chunks = chunks.filter(
          (c) => Array.isArray(c.authors) && c.authors.some((a) => a.trim() === author)
        );
      }
      if (type) {
        chunks = chunks.filter(
          (c) => Array.isArray(c.types) && c.types.some((t) => t.trim() === type)
        );
      }
      return chunks;
    }

    function matchPoem(poem, author, dynasty, type) {
      if (author && (poem.a ?? "").trim() !== author) return false;
      if (dynasty && (poem.d ?? "").trim() !== dynasty) return false;
      if (type && (poem.y ?? "").trim() !== type) return false;
      return true;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function loadRandomPoem(userAction) {
      button.disabled = true;
      button.textContent = "正在读取……";
      progressStart();

      const author = authorInput.value.trim();
      const dynasty = dynastyInput.value.trim();
      const type = typeInput.value.trim();

      try {
        if (!INDEX) {
          showStatus("诗词库尚未加载完成，请稍候……");
          return;
        }

        if ((author || type) && !FULL_INDEX) {
          await ensureFullIndex();
          if (!FULL_INDEX) {
            showStatus("筛选数据加载失败，请检查网络后重试", true);
            return;
          }
        }

        const candidates = filterChunks(author, dynasty, type);
        if (!candidates.length) {
          showStatus("未找到匹配条件的诗", true);
          return;
        }

        const first = weightedRandom(candidates);
        const rest = shuffle(candidates.filter((c) => c.file !== first.file));
        const order = [first].concat(rest);
        const maxTries = Math.min(order.length, 8);

        for (let i = 0; i < maxTries; i++) {
          const chunk = order[i];
          const poems = await loadChunk(chunk.file);
          const matched = poems.filter((p) => matchPoem(p, author, dynasty, type));
          if (matched.length) {
            const poem = matched[Math.floor(Math.random() * matched.length)];
            renderPoem(poem);
            // 用户搜索/抽取有结果后，自动滑到诗词卡片
            if (userAction) {
              card.scrollIntoView({ behavior: "smooth", block: "start" });
            }
            return;
          }
        }
        showStatus("未找到匹配条件的诗", true);
      } catch (err) {
        showStatus("读取失败：" + (err && err.message ? err.message : err), true);
      } finally {
        button.disabled = false;
        button.textContent = "随机显示一首诗";
        progressDone();
      }
    }

    // 加载精简索引（gzip 后约 1KB），首屏极快；带 localStorage 缓存
    async function loadIndex() {
      try {
        const cached = localStorage.getItem(INDEX_CACHE_KEY);
        if (cached) {
          const { data, ts } = JSON.parse(cached);
          if (Date.now() - ts < CACHE_TTL) {
            INDEX = data;
            TOTAL = (INDEX && INDEX.total) || 0;
            try {
              const fc = localStorage.getItem(FULL_CACHE_KEY);
              if (fc) {
                const { data: fd, ts: fts } = JSON.parse(fc);
                if (Date.now() - fts < CACHE_TTL) FULL_INDEX = fd;
              }
            } catch (e) {}
            showStatus(
              "共收录 " + TOTAL.toLocaleString("zh-CN") + " 首诗，点击下方按钮随机抽取"
            );
            return;
          }
        }
      } catch (e) {}

      showStatus("正在加载诗词库……");
      progressStart();
      try {
        const res = await fetch(DATA_BASE + "data/index.json");
        if (!res.ok) throw new Error("索引加载失败 (HTTP " + res.status + ")");
        INDEX = await res.json();
        TOTAL = (INDEX && INDEX.total) || 0;
        showStatus(
          "共收录 " + TOTAL.toLocaleString("zh-CN") + " 首诗，点击下方按钮随机抽取"
        );
        try {
          localStorage.setItem(
            INDEX_CACHE_KEY, JSON.stringify({ data: INDEX, ts: Date.now() })
          );
        } catch (e) {}
        progressDone();
      } catch (err) {
        showStatus(
          "诗词库加载失败：" + (err && err.message ? err.message : err), true
        );
        progressDone();
      }
    }

    // 按需加载筛选索引（含 authors/types，仅筛选时使用）
    async function ensureFullIndex() {
      if (FULL_INDEX) return;
      try {
        const res = await fetch(DATA_BASE + "data/index-full.json");
        if (!res.ok) return;
        FULL_INDEX = await res.json();
        try {
          localStorage.setItem(
            FULL_CACHE_KEY, JSON.stringify({ data: FULL_INDEX, ts: Date.now() })
          );
        } catch (e) {}
      } catch (e) {}
    }

    button.addEventListener("click", loadRandomPoem);

    // ====== 分享：纯 Canvas 手绘诗词卡片（高分辨率、按句排版、间距自适应） ======
    let shareRatio = "1:1";
    document.querySelectorAll(".ratio-opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        shareRatio = btn.dataset.ratio;
        document.querySelectorAll(".ratio-opt").forEach((b) =>
          b.classList.toggle("active", b === btn)
        );
      });
    });

    // 圆角矩形路径（印章方框用）
    function roundRectPath(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    const shareButton = $("shareButton");
    shareButton.addEventListener("click", async () => {
      if (!currentPoem) {
        showStatus("请先随机抽取一首诗，再分享", true);
        return;
      }
      shareButton.disabled = true;
      shareButton.textContent = "生成中……";
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const css = getComputedStyle(document.documentElement);
        const v = (name, fb) => css.getPropertyValue(name).trim() || fb;
        const bg = v("--bg-color", "#f4f1e8");
        const textColor = v("--text-color", "#2f2a24");
        const metaColor = v("--meta-color", "#766d63");
        const accent = v("--accent-color", "#4f5f4a");
        const catColor = v("--category-color", "#958a7e");
        const sealColor = v("--seal-color", "#a3382f");
        const FONT = '"Noto Serif SC", "Songti SC", "SimSun", serif';
        const vertical = currentTheme.direction === "vertical";

        const title = currentPoem.t || "无题";
        const authorMeta = [currentPoem.d, currentPoem.a].filter(Boolean).join(" · ");
        const verses = splitVerses(currentPoem.c);

        // 画布：宽固定 3000px、高按选定比例；文字到边框间距固定，卡片不缩放
        const [rw, rh] = shareRatio.split(":").map(Number);
        const W = 3000;
        const H = Math.round((W * rh) / rw);
        const M = Math.round(W * 0.115);
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // 内框装饰线
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 3;
        ctx.strokeRect(M * 0.45, M * 0.45, W - M * 0.9, H - M * 0.9);
        ctx.globalAlpha = 1;

        // 水印「詩」
        ctx.save();
        ctx.globalAlpha = 0.045;
        ctx.fillStyle = textColor;
        ctx.font = "600 " + Math.round(W * 0.38) + "px " + FONT;
        ctx.fillText("詩", W * 0.8, H * 0.87);
        ctx.restore();

        const footerText = "诗泉 · 非营利古诗词共享项目";

        if (!vertical) {
          // ---------- 横排：先缩字号（不低于落款字号），能不换行尽量不换；仍超长才按逗号/顿号分句换行 ----------
          const availW = W - M * 2 - 100;
          const availH = H - M * 2;
          const minSize = Math.round(W * 0.017); // 最低字号：不小于落款/体裁文字
          const measureLines = (size, list) => {
            ctx.font = size + "px " + FONT;
            let max = 0;
            for (const line of list) {
              max = Math.max(max, ctx.measureText(line).width);
            }
            return { lines: list, max };
          };
          const layoutFor = (size, list) => {
            const mm = measureLines(size, list);
            const sealFont = Math.round(size * 0.85);
            return {
              lines: mm.lines,
              max: mm.max,
              fontSize: size,
              lineH: Math.round(size * 1.8),
              titleFont: Math.round(size * 1.5),
              metaFont: Math.round(size * 0.6),
              catFont: Math.round(size * 0.52),
              sealFont,
              sealBoxH: Math.round(sealFont * 1.7)
            };
          };
          const blockHeight = (L) =>
            L.titleFont + 80 + L.metaFont + 70 + L.lines.length * L.lineH +
            90 + L.sealBoxH + 90 + L.catFont;
          const widestOf = (L) => {
            ctx.font = "600 " + L.titleFont + "px " + FONT;
            const tw = ctx.measureText(title).width;
            ctx.font = L.catFont + "px " + FONT;
            const fw = ctx.measureText(footerText).width;
            ctx.font = "700 " + L.sealFont + "px " + FONT;
            const sw =
              ctx.measureText("诗泉").width + L.sealFont * 0.35 + L.sealFont * 1.24;
            return Math.max(L.max, tw, fw, sw);
          };

          const fitLayout = (list) => {
            let L = layoutFor(Math.round(W * 0.034), list);
            const w0 = widestOf(L);
            if (w0 > availW) {
              L = layoutFor(Math.floor((L.fontSize * availW) / w0), list);
            }
            if (L.fontSize < minSize) L = layoutFor(minSize, list);
            if (blockHeight(L) > availH) {
              L = layoutFor(
                Math.max(minSize, Math.floor((L.fontSize * availH) / blockHeight(L))),
                list
              );
            }
            return L;
          };

          let L = fitLayout(verses);
          if (L.max > availW) {
            // 最低字号仍放不下：按逗号/顿号分句换行，每行都是完整分句
            const clauseLines = [];
            for (const verse of verses) {
              for (const p of splitClauseLines(verse)) clauseLines.push(p);
            }
            L = fitLayout(clauseLines);
          }

          let y = M + Math.max(0, (availH - blockHeight(L)) / 2);
          ctx.fillStyle = textColor;
          ctx.font = "600 " + L.titleFont + "px " + FONT;
          ctx.fillText(title, W / 2, y + L.titleFont / 2);
          y += L.titleFont + 80;
          ctx.fillStyle = metaColor;
          ctx.font = L.metaFont + "px " + FONT;
          ctx.fillText(authorMeta, W / 2, y + L.metaFont / 2);
          y += L.metaFont + 70;
          ctx.fillStyle = textColor;
          ctx.font = L.fontSize + "px " + FONT;
          for (const line of L.lines) {
            ctx.fillText(line, W / 2, y + L.lineH / 2);
            y += L.lineH;
          }
          y += 90;
          // 诗泉印章：红底圆角方框 + 米白字，离边框留足距离
          ctx.font = "700 " + L.sealFont + "px " + FONT;
          const gapSp = L.sealFont * 0.35;
          const textW = ctx.measureText("诗泉").width + gapSp;
          const padX = L.sealFont * 0.62;
          const boxW = textW + padX * 2;
          const bx = W / 2 - boxW / 2;
          ctx.fillStyle = sealColor;
          roundRectPath(ctx, bx, y, boxW, L.sealBoxH, L.sealFont * 0.28);
          ctx.fill();
          ctx.fillStyle = "#f7efe3";
          ctx.textAlign = "left";
          const tx = W / 2 - textW / 2;
          ctx.fillText("诗", tx, y + L.sealBoxH / 2);
          ctx.fillText("泉", tx + ctx.measureText("诗").width + gapSp, y + L.sealBoxH / 2);
          ctx.textAlign = "center";
          y += L.sealBoxH + 90;
          ctx.fillStyle = catColor;
          ctx.font = L.catFont + "px " + FONT;
          ctx.fillText(footerText, W / 2, y + L.catFont / 2);
        } else {
          // ---------- 竖排：右标题列 → 诗句列 → 左作者列，印章在作者列下方；字距行距与横排一致，全部元素不出边框 ----------
          const ADV = 1.8; // 字距/列距系数，与横排行距相同
          const footerH = Math.round(W * 0.05);
          const availH = H - M * 2 - footerH;
          const availW = W - M * 2;
          const maxChars = Math.max(
            title.length, authorMeta.length,
            ...verses.map((x) => x.length), 1
          );
          const vSealFont0 = 0.65; // 印章字号相对字元比例
          // 高：最长列字符跨度 + 印章方框预留；宽：标题列(1.15 间距)+诗句列+作者列+半字余量
          let charSize = Math.min(
            Math.floor(availH / (maxChars * ADV + 4.2)),
            Math.floor(availW / ((verses.length + 1.15) * ADV + 1)),
            Math.round(W * 0.04)
          );
          charSize = Math.max(charSize, 30);
          const colGap = Math.round(charSize * ADV);
          const totalW = colGap * (verses.length + 1.15);
          const vSealFont = Math.round(charSize * vSealFont0);
          const vPadX = vSealFont * 0.5;
          const vPadY = vSealFont * 0.42;
          const vBoxH = vSealFont * 2 + vSealFont * 0.5 + vPadY * 2;
          // 垂直居中：首字顶部到印章底部的总高
          const topPad = charSize * 0.55;
          const totalH = topPad + (maxChars - 1) * colGap + charSize * 0.85 + vBoxH;
          const startY = M + Math.max(0, (availH - totalH) / 2) + topPad;

          const drawVCol = (cx, text, size, weight, color) => {
            ctx.font = weight + " " + size + "px " + FONT;
            ctx.fillStyle = color;
            let yy = startY;
            for (const ch of text) {
              ctx.fillText(ch, cx, yy);
              yy += colGap;
            }
            return yy;
          };

          let x = W / 2 + totalW / 2;
          drawVCol(x, title, Math.round(charSize * 1.1), "600", textColor);
          x -= Math.round(colGap * 1.15);
          for (const verse of verses) {
            drawVCol(x, verse, charSize, "400", textColor);
            x -= colGap;
          }
          drawVCol(x, authorMeta, Math.round(charSize * 0.6), "400", metaColor);
          // 诗泉印章（竖排）：红底圆角方框 + 米白字叠放，紧贴作者列末尾不超出边框
          const lastAuthorY = startY + ((authorMeta.length || maxChars) - 1) * colGap;
          ctx.font = "700 " + vSealFont + "px " + FONT;
          const vBoxW = Math.max(ctx.measureText("诗").width, ctx.measureText("泉").width) + vPadX * 2;
          const vBoxY = Math.min(lastAuthorY + charSize * 0.85, H - M - footerH - vBoxH);
          ctx.fillStyle = sealColor;
          roundRectPath(ctx, x - vBoxW / 2, vBoxY, vBoxW, vBoxH, vSealFont * 0.28);
          ctx.fill();
          ctx.fillStyle = "#f7efe3";
          ctx.fillText("诗", x, vBoxY + vPadY + vSealFont / 2);
          ctx.fillText("泉", x, vBoxY + vPadY + vSealFont * 1.5 + vSealFont / 2);
          ctx.fillStyle = catColor;
          ctx.font = Math.round(W * 0.017) + "px " + FONT;
          ctx.fillText(footerText, W / 2, H - M * 0.5);
        }

        const dataUrl = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = "诗泉_" + shareRatio.replace(":", "x") + "_" + Date.now() + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        showStatus("生成卡片失败：" + (e && e.message ? e.message : e), true);
      } finally {
        shareButton.disabled = false;
        shareButton.textContent = "分享诗词卡片";
      }
    });

    let currentTheme = { color: "warm", layout: "centered", size: "medium", direction: "horizontal" };

    function applyTheme() {
      const root = document.documentElement;
      for (const group of ["color", "layout", "size"]) {
        const theme = THEMES[group] && THEMES[group][currentTheme[group]];
        if (theme) {
          for (const [prop, value] of Object.entries(theme.vars)) {
            root.style.setProperty(prop, value);
          }
        }
      }
      // 文字方向（竖排）
      document.body.classList.toggle("vertical", currentTheme.direction === "vertical");
      // 同步面板选中状态
      document.querySelectorAll(".theme-options").forEach((container) => {
        const group = container.dataset.group;
        const value = currentTheme[group];
        container.querySelectorAll(".theme-opt").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.value === value);
        });
      });
      // 字号/方向变化后重新自适应
      requestAnimationFrame(fitCardText);
    }

    function saveTheme() {
      try { localStorage.setItem(THEME_KEY, JSON.stringify(currentTheme)); } catch (e) {}
    }

    function loadTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (p.color && THEMES.color[p.color]) currentTheme.color = p.color;
          if (p.layout && THEMES.layout[p.layout]) currentTheme.layout = p.layout;
          if (p.size && THEMES.size[p.size]) currentTheme.size = p.size;
          if (p.direction === "vertical" || p.direction === "horizontal") currentTheme.direction = p.direction;
        }
      } catch (e) {}
    }

    document.addEventListener("click", (e) => {
      const panel = $("themePanel");
      if (!panel.classList.contains("open")) return;
      if (panel.contains(e.target) || $("themeToggle").contains(e.target)) return;
      panel.classList.remove("open");
    });

    document.querySelectorAll(".theme-opt").forEach((btn) => {
